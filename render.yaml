services:
  - type: worker
    name: alya-discord-bot
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm bot
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TEST_GUILD_ID
        value: "1541829974611329086"
      - key: DASHBOARD_API_URL
        value: http://localhost:3000/api
      - key: DASHBOARD_API_SECRET
        sync: false
      - key: NODE_VERSION
        value: "20"
